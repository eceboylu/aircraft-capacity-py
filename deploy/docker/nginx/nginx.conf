# HTTPS reverse proxy for the local phpMyAdmin instances - TLS
# terminated here with an mkcert-issued certificate (locally-trusted
# CA, not a public CA - see deploy/docker/README.md for why, and how
# to trust it on another machine/browser).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 8443 -> local (dev) phpMyAdmin -> local_mysql (aircraft_capacity DB)
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 64m;

        location / {
            proxy_pass http://local_phpmyadmin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
