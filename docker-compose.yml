services:
  local_mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_pw
      MYSQL_DATABASE: aircraft_capacity
      MYSQL_USER: app
      MYSQL_PASSWORD: app_local_pw
    ports:
      - "3307:3306"
    volumes:
      - local_mysql_data:/var/lib/mysql

  local_phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - local_mysql
    environment:
      PMA_HOST: local_mysql
      PMA_PORT: 3306
      PMA_USER: app
      PMA_PASSWORD: app_local_pw
      PMA_ABSOLUTE_URI: https://localhost:8443/
    ports:
      - "8082:80"

  https_proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - local_phpmyadmin
    volumes:
      - ./deploy/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/docker/certs:/etc/nginx/certs:ro
    ports:
      - "8443:8443"

volumes:
  local_mysql_data:
    external: true
    name: "72322ca62b98697a115eb47c589d73781f5c81278600f6cf077b8a229265e0a3"
