<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Queue Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #dde1e8;
    --ink: #1c2230;
    --ink-soft: #626b7d;
    --accent: #2f5fa8;
    --accent-bg: #e8effa;

    /* ADIM 6A-UI §7 - backend risk -> renk. Frontend bu 5 rengin
       DIŞINDA hiçbir eşik/renk İCAT ETMEZ. */
    --low: #1f8f4f;
    --low-bg: #e5f5ea;
    --medium: #b8960c;
    --medium-bg: #fbf3d9;
    --high: #c9691a;
    --high-bg: #fbe9dc;
    --critical: #c23b3b;
    --critical-bg: #fbe4e4;
    --unknown: #8a90a0;
    --unknown-bg: #ececef;
    --none: #8a90a0;
    --none-bg: #eceef1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
  #refresh-info { font-size: 12px; color: var(--ink-soft); text-align: right; }
  #error-banner {
    display: none;
    background: var(--critical-bg);
    color: var(--critical);
    border-bottom: 1px solid var(--critical);
    padding: 6px 20px;
    font-size: 12.5px;
  }

  /* ---- Sol filtre + sağ içerik ---- */
  .layout { display: flex; align-items: flex-start; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
  }

  #airport-sidebar {
    flex: 0 0 240px;
    max-width: 280px;
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
  }
  @media (max-width: 760px) {
    #airport-sidebar {
      flex: none;
      width: 100%;
      max-width: none;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-y: visible;
    }
  }
  #airport-sidebar h2 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 8px 8px;
  }

  /* ---- Havalimanı arama/dropdown seçici (desktop + mobile ORTAK) ---- */
  #airport-selector { margin-bottom: 6px; }
  #selected-airport-label {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    line-height: 1.3;
    min-height: 40px;
  }
  #selected-airport-label .muted { color: var(--ink-soft); }
  #airport-search {
    display: none;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    outline: none;
    color: var(--ink);
    background: var(--panel);
  }
  #airport-selector.open #selected-airport-label { display: none; }
  #airport-selector.open #airport-search { display: block; }
  #airport-list {
    display: none;
    margin-top: 6px;
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }
  #airport-selector.open #airport-list { display: block; }
  @media (max-width: 760px) {
    #airport-list { max-height: 50vh; }
  }

  /* ADIM (Desktop Airport Selector Always Open) - Bölüm 1/6: masaüstünde
     arama kutusu + liste SAYFA AÇILIR AÇILMAZ görünür - "open" class'ına
     BAĞIMLI DEĞİL (mobilde hâlâ dropdown/toggle davranışı - bkz. yukarıdaki
     .open kuralları - AYNEN korunuyor, bu blok SADECE >760px'te devreye
     girer). Bu kural bilinçli olarak dosyada YUKARIDAKİ .open kurallarından
     SONRA tanımlandı - eşit özgüllükteki (ID seçici) kurallarda CSS
     sırası kazanır, bu yüzden >760px'te bu blok .open şartından bağımsız
     olarak KAZANIR (mobil <=760px'te ise bu blok hiç eşleşmez, .open
     davranışı DEĞİŞMEDEN kalır). */
  @media (min-width: 761px) {
    #selected-airport-label { display: none; }
    #airport-search { display: block; margin-top: 0; }
    #airport-list { display: block; max-height: min(60vh, 480px); }
  }

  .airport-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    padding: 11px 10px;
    min-height: 44px;   /* touch-friendly hedef (Bölüm H) */
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--ink);
    cursor: pointer;
    line-height: 1.3;
  }
  .airport-item:hover { background: var(--bg); }
  .airport-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .airport-item .code { font-weight: 700; }
  .airport-item .name { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }
  .airport-item.active .name { color: var(--accent); opacity: 0.75; }
  #airport-sidebar .empty { color: var(--ink-soft); font-size: 13px; padding: 8px; }

  #airport-content { flex: 1 1 auto; padding: 20px 24px; min-width: 0; }

  #airport-content h2 { font-size: 21px; font-weight: 700; margin: 0 0 12px; }

  .overall-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }

  .process-block { margin-bottom: 18px; max-width: 640px; }
  .process-block h3 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    font-weight: 700;
    font-size: 14px;
    padding: 3px 11px;
    border-radius: 6px;
  }
  .pill-LOW { color: var(--low); background: var(--low-bg); }
  .pill-MEDIUM { color: var(--medium); background: var(--medium-bg); }
  .pill-HIGH { color: var(--high); background: var(--high-bg); }
  .pill-CRITICAL { color: var(--critical); background: var(--critical-bg); }
  .pill-UNKNOWN { color: var(--unknown); background: var(--unknown-bg); }
  .pill-none { color: var(--none); background: var(--none-bg); }

  .chart-wrap { position: relative; height: 150px; margin-bottom: 8px; }
  .chart-empty {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 12.5px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .current-line { font-size: 13px; margin-top: 2px; }
  .wait-line { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .wait-line b { color: var(--ink); font-weight: 600; }
  .wait-detail { font-size: 11.5px; color: var(--ink-soft); opacity: 0.8; margin-top: 1px; }

  /* ---- Operasyon dağılımı ---- */
  #breakdown { max-width: 360px; margin-top: 4px; }
  #breakdown h3 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12.5px; }
  .bar-row .bar-label { flex: 0 0 92px; color: var(--ink-soft); }
  .bar-row .bar-track { flex: 1 1 auto; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-row .bar-value { flex: 0 0 26px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  #breakdown .note { color: var(--ink-soft); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>AIRPORT QUEUE STATUS</h1>
  <div id="refresh-info"></div>
</header>
<div id="error-banner">Veri yenilenemedi - son bilinen değerler gösteriliyor.</div>

<div class="layout">
  <div id="airport-sidebar">
    <h2>Havalimanları</h2>
    <div id="airport-selector">
      <button type="button" id="selected-airport-label"></button>
      <input id="airport-search" type="text" autocomplete="off"
             placeholder="Havalimanı ara... (IATA veya isim)">
      <div id="airport-list"></div>
    </div>
  </div>
  <div id="airport-content"></div>
</div>

<script>
(function () {
  "use strict";

  // ADIM 6A-UI §7 / 6A-UI-2 - backend risk -> UI renk sınıfı. TEK
  // yer; frontend başka HİÇBİR eşik/etiket İCAT ETMEZ.
  var PILL_CLASS = {
    LOW: "pill-LOW", MEDIUM: "pill-MEDIUM", HIGH: "pill-HIGH",
    CRITICAL: "pill-CRITICAL", UNKNOWN: "pill-UNKNOWN",
  };
  var SEVERITY_HEIGHT = { UNKNOWN: 0.3, LOW: 1, MEDIUM: 2, HIGH: 3, CRITICAL: 4 };
  var SEVERITY_COLOR = {
    UNKNOWN: "#b3b7c2", LOW: "#2fa968", MEDIUM: "#d1a92c",
    HIGH: "#e08a3c", CRITICAL: "#d4514f",
  };

  // ADIM (Frontend 4-Graph Contract) - Bölüm 26/52: source artık
  // yaklaşık 5 dakikada bir yenileniyor - bu SADECE dış veri
  // yenilenme sıklığıdır (queue window/prediction window/service
  // interval DEĞİL, bkz. backend). Frontend request-time'da HİÇBİR
  // dış kaynağa çıkmaz, sadece kendi API'sini (DB'den okuyan,
  // salt-okunur) bu sıklıkla tekrar okur.
  var POLL_MS = 5 * 60 * 1000;

  var state = {
    directory: [],          // [{iata, name}] - son BAŞARILI /api/airports/directory
    selected: null,         // seçili IATA kodu
    predictionsByIata: {},  // iata -> son BAŞARILI /predictions yanıtı
    charts: {},
    searchQuery: "",        // ADIM (Airport Search) - kullanıcının arama kutusuna yazdığı METİN
    selectorOpen: false,    // ADIM (Airport Search/Mobile Selector) - dropdown açık mı
    // ADIM (Frontend 4-Graph Contract) - Bölüm 50/64/67: her grafik
    // kendi tıklanan penceresini BAĞIMSIZ tutar. `null` = "şu anki
    // pencere" (current) gösterilsin. DEĞER olarak array INDEX değil,
    // pencerenin KENDİ `window_start` ISO string'i tutulur - böylece
    // 5 dakikalık refresh sonrası pencere listesi değişse/kayса bile
    // (ör. eski bir pencere prune edildi) aynı SAAT aranır, aynı
    // array pozisyonu YANLIŞLIKLA başka bir saati göstermez (Bölüm 64:
    // "refresh sonrası 10.00 bucket hâlâ varsa selection kaybolmamalı").
    // Bucket artık yoksa `graphSectionHtml` güvenli şekilde `current`'a
    // düşer.
    detail: {
      overall: null, domestic_security: null,
      international_departure_passport: null, international_departure_security: null,
      international_arrival: null,
    },
  };

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function pillHtml(riskOrNull, labelOrNull) {
    if (!riskOrNull || !labelOrNull) {
      return '<span class="pill pill-none">Veri bulunamadı</span>';
    }
    var cls = PILL_CLASS[riskOrNull] || "pill-none";
    return '<span class="pill ' + cls + '">' + escapeHtml(labelOrNull) + "</span>";
  }

  // Backend zaman damgaları HER ZAMAN naive UTC ISO string'dir - bkz.
  // app/queue/api.py. `new Date(...)` ile parse etmek tarayıcının
  // YEREL saat dilimini karıştırır (YENİ bir dönüşüm İCAT ETMEK
  // olurdu); bunun yerine ISO string'den saat:dakika STRING olarak
  // kesilir.
  function hhmm(isoString) {
    return isoString.slice(11, 16);
  }

  // ADIM (24-Hour Graph Timezone Display) - Bölüm 4/14: BEŞ görünür
  // grafiğin (Overall/Domestic Security/Intl Departure — Passport/
  // — Security/Intl Arrival) pencere label'ı artık backend'in
  // hesapladığı `window_start_local` (havalimanının GERÇEK yerel saati,
  // bkz. app/queue/api.py `_to_local_iso`) üzerinden üretilir -
  // `window_start` (CANONICAL/internal UTC) DEĞİŞMEDİ, sadece hangi
  // alanın LABEL için okunacağı değişti. `window_start_local` yoksa
  // (havalimanının timezone'u çözülemediyse - nadir, bkz. backend
  // fallback notu) ham `window_start`'a (UTC) güvenli şekilde düşülür -
  // frontend YENİ bir offset/dönüşüm İCAT ETMEZ, sadece backend'in
  // ZATEN hesapladığı alanı okur. `traffic_breakdown()` (Operasyon
  // Dağılımı) bu contract'ın DIŞINDA - kendi ham `window_start`'ını
  // (hhmm() ile) kullanmaya devam eder (backend ona hiç local alan
  // eklemedi, Bölüm 5 kapsamı SADECE 5 risk/wait grafiği).
  function windowLabel(window) {
    var value = (window && window.window_start_local) || (window && window.window_start);
    return value ? hhmm(value) : "";
  }

  function windowLabelRange(window) {
    var startValue = (window && window.window_start_local) || (window && window.window_start);
    var endValue = (window && window.window_end_local) || (window && window.window_end);
    if (!startValue || !endValue) return "";
    return hhmm(startValue) + "–" + hhmm(endValue);
  }

  function airportLabel(entry) {
    return entry.name ? entry.iata + " - " + entry.name : entry.iata;
  }

  // ADIM (Frontend Airport Search) - Bölüm F: case-insensitive, Türkçe
  // karakterlere karşı normalize edilmiş arama. "İstanbul"/"istanbul"/
  // "İSTANBUL" hepsi AYNI şekilde eşleşsin diye Türkçe'ye özgü harfler
  // (İ/I/ı/Ş/ş/Ğ/ğ/Ü/ü/Ö/ö/Ç/ç) ASCII karşılıklarına çevrilir, SONRA
  // `toLowerCase()` uygulanır (sıra önemli: `"İ".toLowerCase()` bazı
  // ortamlarda "i̇" - noktalı, birleşik karakter - üretebilir).
  var TURKISH_FOLD_MAP = {
    "İ": "i", "I": "i", "ı": "i",
    "Ş": "s", "ş": "s",
    "Ğ": "g", "ğ": "g",
    "Ü": "u", "ü": "u",
    "Ö": "o", "ö": "o",
    "Ç": "c", "ç": "c",
  };
  function normalizeSearchText(text) {
    if (!text) return "";
    var folded = String(text).replace(/[İIışŞğĞüÜöÖçÇ]/g, function (ch) {
      return TURKISH_FOLD_MAP[ch] || ch;
    });
    return folded.toLowerCase();
  }

  function filteredDirectory() {
    var query = normalizeSearchText(state.searchQuery.trim());
    if (!query) return state.directory;
    return state.directory.filter(function (entry) {
      var haystack = normalizeSearchText(entry.iata) + " " + normalizeSearchText(entry.name || "");
      return haystack.indexOf(query) !== -1;
    });
  }

  function openSelector() {
    state.selectorOpen = true;
    document.getElementById("airport-selector").classList.add("open");
    document.getElementById("airport-search").focus();
  }

  function closeSelector() {
    state.selectorOpen = false;
    state.searchQuery = "";
    document.getElementById("airport-selector").classList.remove("open");
    var input = document.getElementById("airport-search");
    input.value = "";
    input.blur();
  }

  // ADIM (Desktop Airport Selector Always Open) - Bölüm 6/8: masaüstünde
  // arama/liste zaten HER ZAMAN görünür (bkz. CSS `@media (min-width:761px)`) -
  // bu yüzden seçim yapıldığında `closeSelector()` (listeyi kapatır, arama
  // metnini TEMİZLER) SADECE mobilde çağrılmalı; masaüstünde kullanıcı
  // filtre metnini/listeyi korumalı, hızlıca başka bir havalimanına
  // geçebilmeli (Bölüm 3). `window.matchMedia` yoksa (ör. bazı test
  // ortamları) güvenli varsayım "mobil DEĞİL" (masaüstü davranışı) - bu,
  // mobil davranışını YANLIŞLIKLA tetiklemek yerine sessizce hiçbir şey
  // KAPATMAMA yönünde daha az yıkıcı bir varsayımdır.
  function isMobileViewport() {
    return typeof window.matchMedia === "function" &&
      window.matchMedia("(max-width: 760px)").matches;
  }

  // ------------- fetch -------------

  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  // ADIM (Local Test-DB Viewing) - sayfa kendisi `?now=...` ile açıldıysa
  // (ör. eski tarihli bir test DB'sini görüntülemek için), bu SADECE
  // prediction endpoint'lerine iletilir - production varsayılan davranışı
  // (parametre yoksa gerçek duvar saati) DEĞİŞMEDİ. `window.location`
  // olmayan ortamlarda (ör. Node tabanlı frontend test harness'leri,
  // `tests/frontend_harness/*.js` - sadece `window`/`document` stub'lar,
  // `location` stub'lamaz) sessizce None'a düşer, hiçbir exception atmaz.
  var TEST_NOW = (typeof window !== "undefined" && window.location && window.location.search)
    ? new URLSearchParams(window.location.search).get("now")
    : null;

  function predictionsUrl(iata) {
    var url = "/api/airports/" + iata + "/predictions";
    return TEST_NOW ? url + "?now=" + encodeURIComponent(TEST_NOW) : url;
  }

  function loadAll() {
    return fetchJSON("/api/airports/directory").then(function (directory) {
      state.directory = directory;
      reconcileSelection();
      renderSidebar();

      if (!state.selected) {
        renderContent();
        setError(false);
        return null;
      }
      return fetchJSON(predictionsUrl(state.selected)).then(function (data) {
        state.predictionsByIata[state.selected] = data;
        renderContent();
        setError(false);
      });
    }).catch(function () {
      setError(true);
      // state KASITLI OLARAK değiştirilmiyor - ekrandaki son bilinen
      // durum kalır, sadece uyarı gösterilir. Bir havalimanının
      // prediction isteği başarısız olsa bile SİDEBAR'ın kendisi
      // (directory zaten yukarıda ayrı fetch edildi) etkilenmez.
    });
  }

  // ADIM 6A-UI-2 §4 - dinamik keşif: IST seçiliyken yeni bir AYT
  // gelirse seçim ATLAMAZ. Seçili havalimanı listeden GERÇEKTEN
  // kaybolursa (örn. artık hiç tahmini yok) ilk mevcut havalimanına
  // güvenli fallback yapılır. İlk açılışta IST varsa IST, yoksa
  // listedeki ilk havalimanı seçilir.
  function reconcileSelection() {
    var codes = state.directory.map(function (e) { return e.iata; });
    if (state.selected && codes.indexOf(state.selected) !== -1) {
      return; // seçim hâlâ geçerli - DOKUNMA
    }
    if (codes.indexOf("IST") !== -1) {
      state.selected = "IST";
    } else {
      state.selected = codes.length ? codes[0] : null;
    }
  }

  function selectAirport(iata) {
    // ADIM (Frontend Airport Search + Desktop Always Open) - Bölüm G/I
    // (mobil): seçim yapılınca dropdown/arama KAPANIR - aynı havalimanı
    // zaten seçiliyken tekrar tıklansa BİLE dropdown kapanmalı; bu
    // yüzden "aynıysa hiçbir şey yapma" kısayolu en üstte DEĞİL, önce
    // KAPATMA yapılır. Bölüm 3/8 (masaüstü): liste zaten HER ZAMAN açık
    // olduğu için `closeSelector()` masaüstünde ÇAĞRILMAZ - kullanıcı
    // arama metnini/listeyi koruyarak hızlıca başka bir havalimanına
    // geçebilir.
    if (isMobileViewport()) {
      closeSelector();
    }
    renderSidebar();
    if (iata === state.selected) return;
    state.selected = iata;
    renderSidebar();
    if (!state.predictionsByIata[iata]) {
      renderContent(); // yükleniyor durumu göster
    }
    fetchJSON(predictionsUrl(iata)).then(function (data) {
      state.predictionsByIata[iata] = data;
      if (state.selected === iata) renderContent();
    }).catch(function () {
      setError(true);
    });
  }

  // ------------- render: sidebar -------------

  function renderSelectedLabel() {
    var label = document.getElementById("selected-airport-label");
    var entry = state.directory.filter(function (e) { return e.iata === state.selected; })[0];
    if (entry) {
      label.innerHTML = escapeHtml(airportLabel(entry));
    } else {
      label.innerHTML = '<span class="muted">Havalimanı seç...</span>';
    }
  }

  function renderSidebar() {
    renderSelectedLabel();

    var el = document.getElementById("airport-list");
    if (!state.directory.length) {
      el.innerHTML = '<div class="empty">Henüz izlenen havalimanı yok.</div>';
      return;
    }
    var visible = filteredDirectory();
    if (!visible.length) {
      el.innerHTML = '<div class="empty">"' + escapeHtml(state.searchQuery) + '" için sonuç bulunamadı.</div>';
      return;
    }
    el.innerHTML = visible.map(function (entry) {
      var active = entry.iata === state.selected ? " active" : "";
      return (
        '<button class="airport-item' + active + '" data-iata="' + entry.iata + '">' +
          '<span class="code">' + escapeHtml(entry.iata) + "</span>" +
          (entry.name ? '<span class="name">' + escapeHtml(entry.name) + "</span>" : "") +
        "</button>"
      );
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".airport-item"), function (btn) {
      btn.addEventListener("click", function () {
        selectAirport(btn.getAttribute("data-iata"));
      });
    });
  }

  // ADIM (Frontend Airport Search/Mobile Selector) - Bölüm G/H/I: arama
  // kutusu odaklanınca (masaüstü tıklama VEYA mobil dokunma - ikisi de
  // "focus" event'i tetikler) dropdown açılır; yazarken CANLI filtrelenir;
  // dropdown DIŞINA tıklanınca kapanır (seçim yapmadan vazgeçme).
  function wireAirportSelector() {
    var selectorEl = document.getElementById("airport-selector");
    var labelEl = document.getElementById("selected-airport-label");
    var inputEl = document.getElementById("airport-search");

    labelEl.addEventListener("click", openSelector);
    inputEl.addEventListener("focus", openSelector);
    inputEl.addEventListener("input", function () {
      state.searchQuery = inputEl.value;
      renderSidebar();
      // renderSidebar() `#airport-list`'i YENİDEN OLUŞTURUYOR (innerHTML) -
      // input'un KENDİSİ DOM'da aynı elemandır (yeniden oluşturulmuyor),
      // bu yüzden odak/imleç konumu KORUNUR - kullanıcı yazmaya kesintisiz devam eder.
    });
    // ADIM (Desktop Airport Selector Always Open) - Bölüm 6: dışına
    // tıklama/Escape ile "kapatma" SADECE mobilde bir anlam taşır -
    // masaüstünde panel zaten HER ZAMAN açık (CSS), bu ikisi tetiklenirse
    // SADECE arama metnini gereksiz yere TEMİZLERDİ (kullanıcı grafiğe
    // tıklayınca filtresi sıfırlanır gibi sürpriz bir davranış). Bu
    // yüzden ikisi de `isMobileViewport()` ile korunuyor.
    document.addEventListener("click", function (evt) {
      if (isMobileViewport() && state.selectorOpen && !selectorEl.contains(evt.target)) {
        closeSelector();
        renderSidebar();
      }
    });
    document.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape" && isMobileViewport() && state.selectorOpen) {
        closeSelector();
        renderSidebar();
      }
    });
  }

  // ------------- render: sağ panel -------------

  function renderContent() {
    var root = document.getElementById("airport-content");
    Object.keys(state.charts).forEach(destroyChart);

    if (!state.selected) {
      root.innerHTML = "";
      return;
    }
    var data = state.predictionsByIata[state.selected];
    var entry = state.directory.filter(function (e) { return e.iata === state.selected; })[0];
    var heading = entry ? airportLabel(entry) : state.selected;

    if (!data) {
      root.innerHTML = "<h2>" + escapeHtml(heading) + "</h2><p>Yükleniyor...</p>";
      return;
    }

    // ADIM (International Departure Split Graphs) - Bölüm 9-13: TAM 5
    // grafik - Overall / Domestic Security / International Departure
    // — Passport / International Departure — Security / International
    // Arrival (SADECE varış-kökenli passport). Passport ve security
    // artık İKİ BAĞIMSIZ grafik/current/wait - biri diğerinin current
    // saatini ASLA EZMEZ (ZRH regresyonu, bkz. api.py
    // `_international_departure_split`). Beşinci bir "domestic arrival"
    // grafiği YOK (Bölüm 16, değişmedi).
    root.innerHTML =
      "<h2>" + escapeHtml(heading) + "</h2>" +
      graphSectionHtml("overall", "GENEL HAVALİMANI YOĞUNLUĞU", data.overall) +
      graphSectionHtml("domestic_security", "DOMESTIC SECURITY", data.domestic_security) +
      graphSectionHtml("international_departure_passport", "INTERNATIONAL DEPARTURE — PASSPORT", data.international_departure.passport) +
      graphSectionHtml("international_departure_security", "INTERNATIONAL DEPARTURE — SECURITY", data.international_departure.security) +
      graphSectionHtml("international_arrival", "INTERNATIONAL ARRIVAL", data.international_arrival) +
      breakdownHtml(data.breakdown);

    drawChart(data.overall.windows, "chart-overall", "overall");
    drawChart(data.domestic_security.windows, "chart-domestic_security", "domestic_security");
    drawChart(data.international_departure.passport.windows, "chart-international_departure_passport", "international_departure_passport");
    drawChart(data.international_departure.security.windows, "chart-international_departure_security", "international_departure_security");
    drawChart(data.international_arrival.windows, "chart-international_arrival", "international_arrival");
    renderRefreshInfo();
  }

  // ADIM (Frontend Wait-Time Formatting) - SADECE GÖSTERİM katmanı.
  // Backend/API dakika sayısını (ör. 125) DEĞİŞTİRMEZ - bu fonksiyon
  // sadece o sayıyı okunabilir "saat + dakika" metnine çevirir
  // (125 -> "2 saat 5 dk"). Queue/risk/passport/security hesapları
  // bu dosyada ZATEN yok (bkz. waitTimeText docstring'i) - bu
  // fonksiyon da hiçbir hesap YAPMAZ, sadece biçimlendirir.
  //
  // Overall / Domestic Security / International Departure — Passport /
  // International Departure — Security (artık iki BAĞIMSIZ grafik,
  // bkz. `_international_departure_split`) / International Arrival -
  // hepsi AYNI bu merkezi fonksiyonu kullanır (waitTimeText üzerinden),
  // mantık HİÇBİR YERDE kopyalanmaz.
  //
  // Kurallar:
  //   null/undefined           -> "Hesaplanamıyor"
  //   0                        -> "0 dk"
  //   1-59                     -> "N dk"
  //   tam saat (60, 120, ...)  -> "N saat"  (gereksiz "0 dk" EKLENMEZ)
  //   saat + dakika (65, 125)  -> "N saat M dk"
  function formatWaitMinutes(minutes) {
    if (minutes == null) return "Hesaplanamıyor";
    var total = Math.round(minutes);
    if (total < 60) return total + " dk";
    var hours = Math.floor(total / 60);
    var rem = total % 60;
    return rem === 0 ? hours + " saat" : hours + " saat " + rem + " dk";
  }

  // Bekleme süresi metni SADECE backend'in o pencere için ZATEN
  // döndürdüğü alanlara (`estimated_wait_minutes`, `utilization`)
  // bakar - YENİ bir Erlang-C/ortalama/tahmin hesabı YAPILMAZ.
  // ADIM 6C'den KORUNAN ayrım: `estimated_wait_minutes=null` İKİ AYRI
  // nedenle olabilir:
  //   1) `utilization` SONLU VE >= 1 -> talep kapasiteyi gerçekten
  //      aşıyor, kuyruk teorik olarak sürdürülemez -> "Kapasite aşıldı".
  //   2) `utilization` DA null -> sistem bir çalışma noktası bile
  //      KURAMADI (geçersiz/eksik config) -> "Hesaplanamıyor".
  // GENEL (overall) penceresi, o saatin en kötü sürecinin KENDİ
  // `estimated_wait_minutes`'ını taşır (bkz. api.py
  // `_merge_overall_series`) - birden fazla sürecin wait'i ASLA
  // ORTALANMAZ.
  function waitTimeText(w) {
    if (!w) return "—";
    if (w.estimated_wait_minutes != null) {
      return formatWaitMinutes(w.estimated_wait_minutes);
    }
    if (w.utilization != null && w.utilization >= 1) {
      return "Kapasite aşıldı";
    }
    return "Hesaplanamıyor";
  }

  // ADIM (International Departure Split Graphs) - Bölüm 14: risk
  // seviyesi FARK ETMEKSİZİN (LOW dahil) sayısal wait varsa GÖSTERİLİR,
  // risk wait'i gizlemez. International Departure artık İKİ AYRI
  // grafik olduğu için (bkz. `_international_departure_split`) burada
  // tek bir pencerenin wait'i gösterilir - passport/security KENDİ
  // ayrı `graphSectionHtml()` çağrısıyla render edilir, artık BURADA
  // birleştirilmez.
  function waitDetailHtml(displayWindow) {
    if (!displayWindow) {
      return '<div class="wait-line">Bu saat için veri yok</div>';
    }
    return '<div class="wait-line">Tahmini bekleme süresi: <b>' + escapeHtml(waitTimeText(displayWindow)) + "</b></div>";
  }

  // ADIM (Frontend 4-Graph Contract) - Bölüm 50/64/67: her grafik
  // BAĞIMSIZ tıklanabilir. `state.detail[key]` bir `window_start` ISO
  // string'i ise, GERÇEKTEN o saate ait pencere `windows` içinde
  // ARANIR (index DEĞİL - bkz. `state` yorumu) - bulunamazsa (ör.
  // refresh sonrası prune edildi) `current`'a güvenli şekilde düşülür;
  // `current` da yoksa (windows=[]) "Bu saat için veri yok" gösterilir,
  // sayfa ÇÖKMEZ. Bir grafikte bir pencereye tıklamak DİĞER
  // grafiklerin/`current`ın gösterdiği değeri ASLA karıştırmaz.
  function graphSectionHtml(key, title, section) {
    var windows = section.windows || [];
    var selectedStart = state.detail[key];
    var displayWindow = null;
    var usingCurrent = false;
    if (selectedStart != null) {
      for (var i = 0; i < windows.length; i++) {
        if (windows[i].window_start === selectedStart) { displayWindow = windows[i]; break; }
      }
    }
    if (!displayWindow) {
      displayWindow = section.current || null;
      usingCurrent = true;
    }
    var canvasId = "chart-" + key;
    var chartArea = windows.length
      ? '<div class="chart-wrap"><canvas id="' + canvasId + '"></canvas></div>'
      : '<div class="chart-empty">Bu havalimanı için henüz pencere yok.</div>';

    var rangeText = displayWindow ? windowLabelRange(displayWindow) : "";
    var suffix = displayWindow && usingCurrent ? " · şu anki pencere" : "";
    var risk = displayWindow ? displayWindow.risk : null;
    var label = displayWindow ? displayWindow.risk_label : null;

    return (
      '<div class="process-block">' +
        "<h3>" + title + "</h3>" +
        chartArea +
        '<div class="current-line">' + pillHtml(risk, label) + "</div>" +
        (rangeText ? '<div class="wait-detail">' + escapeHtml(rangeText + suffix) + "</div>" : "") +
        waitDetailHtml(displayWindow) +
      "</div>"
    );
  }

  // ADIM 6A-UI-2 §6-7 - Operasyon dağılımı: SADECE Flight tablosundan
  // türetilen uçuş SAYISI (departure/arrival, domestic/international).
  // Yolcu sayısı YOK. `breakdown` backend'de o an için üretilemediyse
  // (bkz. app/queue/api.py:traffic_breakdown) bu AÇIKÇA gösterilir -
  // sahte/sıfır bir sayı ÜRETİLMEZ.
  function breakdownHtml(breakdown) {
    if (!breakdown) {
      return (
        '<div id="breakdown"><h3>Operasyon Dağılımı</h3>' +
        '<p class="note">Bu an için uçuş dağılımı hesaplanamıyor.</p></div>'
      );
    }
    var max = Math.max(breakdown.departures, breakdown.arrivals, breakdown.domestic, breakdown.international, 1);
    function row(label, value) {
      var pct = Math.round((value / max) * 100);
      return (
        '<div class="bar-row"><span class="bar-label">' + label + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="bar-value">' + value + "</span></div>"
      );
    }
    return (
      '<div id="breakdown"><h3>Operasyon Dağılımı (' +
      hhmm(breakdown.window_start) + "–" + hhmm(breakdown.window_end) + ")</h3>" +
      row("Departures", breakdown.departures) +
      row("Arrivals", breakdown.arrivals) +
      row("Domestic", breakdown.domestic) +
      row("International", breakdown.international) +
      "</div>"
    );
  }

  function renderRefreshInfo() {
    document.getElementById("refresh-info").textContent =
      "Son güncelleme: " + new Date().toLocaleTimeString() + " · 5 dk sonra yenilenecek";
  }

  function setError(isError) {
    document.getElementById("error-banner").style.display = isError ? "block" : "none";
  }

  // ------------- charts -------------

  function destroyChart(k) {
    if (state.charts[k]) {
      state.charts[k].destroy();
      delete state.charts[k];
    }
  }

  function drawChart(windows, canvasId, key) {
    if (!windows.length) return;
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;

    var labels = windows.map(function (w) { return windowLabel(w); });
    var heights = windows.map(function (w) { return SEVERITY_HEIGHT[w.risk]; });
    var colors = windows.map(function (w) { return SEVERITY_COLOR[w.risk] || SEVERITY_COLOR.UNKNOWN; });

    state.charts[canvasId] = new Chart(canvas, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [{ data: heights, backgroundColor: colors, borderRadius: 2, maxBarThickness: 14 }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        // ADIM (Frontend 4-Graph Contract) - Bölüm 50/64/67: bir çubuğa
        // tıklamak SADECE bu grafiğin (`key`) kendi seçili penceresini
        // değiştirir; hesaplama YAPILMAZ, sadece zaten yüklü pencerenin
        // KENDİ `window_start`'ı saklanır (array index DEĞİL - bkz.
        // `state` yorumu, refresh sonrası aynı SAAT'i bulabilmek için).
        onClick: function (evt, elements) {
          if (!elements.length) return;
          state.detail[key] = windows[elements[0].index].window_start;
          renderContent();
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            displayColors: false,
            callbacks: {
              title: function (items) {
                var w = windows[items[0].dataIndex];
                return windowLabelRange(w);
              },
              label: function (item) {
                var w = windows[item.dataIndex];
                return w.risk_label || "Bilinmiyor";
              },
            },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { autoSkip: true, maxRotation: 0, font: { size: 10 } },
          },
          y: {
            min: 0,
            max: 4.3,
            grid: { color: "#eef0f3" },
            ticks: {
              stepSize: 1,
              callback: function (value) {
                return { 1: "NORMAL", 2: "YOĞUN", 3: "ÇOK YOĞUN" }[value] || "";
              },
              font: { size: 10 },
            },
          },
        },
      },
    });
  }

  // ------------- boot -------------

  wireAirportSelector();
  loadAll();
  setInterval(loadAll, POLL_MS);
})();
</script>
</body>
</html>
