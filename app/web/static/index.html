<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Queue Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #dde1e8;
    --ink: #1c2230;
    --ink-soft: #626b7d;
    --accent: #2f5fa8;
    --accent-bg: #e8effa;

    /* ADIM 6A-UI §7 - backend risk -> renk. Frontend bu 5 rengin
       DIŞINDA hiçbir eşik/renk İCAT ETMEZ. */
    --low: #1f8f4f;
    --low-bg: #e5f5ea;
    --medium: #b8960c;
    --medium-bg: #fbf3d9;
    --high: #c9691a;
    --high-bg: #fbe9dc;
    --critical: #c23b3b;
    --critical-bg: #fbe4e4;
    --unknown: #8a90a0;
    --unknown-bg: #ececef;
    --none: #8a90a0;
    --none-bg: #eceef1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
  #refresh-info { font-size: 12px; color: var(--ink-soft); text-align: right; }
  #error-banner {
    display: none;
    background: var(--critical-bg);
    color: var(--critical);
    border-bottom: 1px solid var(--critical);
    padding: 6px 20px;
    font-size: 12.5px;
  }

  /* ---- Sol filtre + sağ içerik ---- */
  .layout { display: flex; align-items: flex-start; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
  }

  #airport-sidebar {
    flex: 0 0 240px;
    max-width: 280px;
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
  }
  @media (max-width: 760px) {
    #airport-sidebar {
      flex: none;
      width: 100%;
      max-width: none;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-y: visible;
    }
  }
  #airport-sidebar h2 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 8px 8px;
  }

  /* ---- Havalimanı arama/dropdown seçici (desktop + mobile ORTAK) ---- */
  #airport-selector { margin-bottom: 6px; }
  #selected-airport-label {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    line-height: 1.3;
    min-height: 40px;
  }
  #selected-airport-label .muted { color: var(--ink-soft); }
  #airport-search {
    display: none;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    outline: none;
    color: var(--ink);
    background: var(--panel);
  }
  #airport-selector.open #selected-airport-label { display: none; }
  #airport-selector.open #airport-search { display: block; }
  #airport-list {
    display: none;
    margin-top: 6px;
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }
  #airport-selector.open #airport-list { display: block; }
  @media (max-width: 760px) {
    #airport-list { max-height: 50vh; }
  }

  /* ADIM (Desktop Airport Selector Always Open) - Bölüm 1/6: masaüstünde
     arama kutusu + liste SAYFA AÇILIR AÇILMAZ görünür - "open" class'ına
     BAĞIMLI DEĞİL (mobilde hâlâ dropdown/toggle davranışı - bkz. yukarıdaki
     .open kuralları - AYNEN korunuyor, bu blok SADECE >760px'te devreye
     girer). Bu kural bilinçli olarak dosyada YUKARIDAKİ .open kurallarından
     SONRA tanımlandı - eşit özgüllükteki (ID seçici) kurallarda CSS
     sırası kazanır, bu yüzden >760px'te bu blok .open şartından bağımsız
     olarak KAZANIR (mobil <=760px'te ise bu blok hiç eşleşmez, .open
     davranışı DEĞİŞMEDEN kalır). */
  @media (min-width: 761px) {
    #selected-airport-label { display: none; }
    #airport-search { display: block; margin-top: 0; }
    #airport-list { display: block; max-height: min(60vh, 480px); }
  }

  .airport-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    padding: 11px 10px;
    min-height: 44px;   /* touch-friendly hedef (Bölüm H) */
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--ink);
    cursor: pointer;
    line-height: 1.3;
  }
  .airport-item:hover { background: var(--bg); }
  .airport-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .airport-item .code { font-weight: 700; }
  .airport-item .name { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }
  .airport-item.active .name { color: var(--accent); opacity: 0.75; }
  #airport-sidebar .empty { color: var(--ink-soft); font-size: 13px; padding: 8px; }

  #airport-content { flex: 1 1 auto; padding: 20px 24px; min-width: 0; }

  #airport-content h2 { font-size: 21px; font-weight: 700; margin: 0 0 12px; }

  .overall-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }

  .process-block {
    margin-bottom: 18px;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px 12px;
  }
  .process-block-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .process-block h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin: 0;
  }
  .process-block .eyebrow {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .estimate-summary { text-align: right; }
  @media (max-width: 420px) { .estimate-summary { text-align: left; } }
  .estimate-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 5px;
  }
  .estimate-badge-LOW { color: var(--low); background: var(--low-bg); }
  .estimate-badge-MEDIUM { color: var(--medium); background: var(--medium-bg); }
  .estimate-badge-HIGH { color: var(--high); background: var(--high-bg); }
  .estimate-badge-CRITICAL { color: var(--critical); background: var(--critical-bg); }
  .estimate-badge-UNKNOWN, .estimate-badge-none { color: var(--unknown); background: var(--unknown-bg); }
  .peak-best-line { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .process-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 10.5px;
    color: var(--ink-soft);
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 8px;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-color, var(--ink-soft));
  }
  .legend-dot-current {
    background: transparent;
    border: 2px solid #6fcf97;
    width: 6px;
    height: 6px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    font-weight: 700;
    font-size: 14px;
    padding: 3px 11px;
    border-radius: 6px;
  }
  .pill-LOW { color: var(--low); background: var(--low-bg); }
  .pill-MEDIUM { color: var(--medium); background: var(--medium-bg); }
  .pill-HIGH { color: var(--high); background: var(--high-bg); }
  .pill-CRITICAL { color: var(--critical); background: var(--critical-bg); }
  .pill-UNKNOWN { color: var(--unknown); background: var(--unknown-bg); }
  .pill-none { color: var(--none); background: var(--none-bg); }

  .chart-wrap { position: relative; height: 150px; margin-bottom: 8px; }
  .chart-empty {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 12.5px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .current-line { font-size: 13px; margin-top: 2px; }
  .wait-line { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .wait-line b { color: var(--ink); font-weight: 600; }
  .wait-detail { font-size: 11.5px; color: var(--ink-soft); opacity: 0.8; margin-top: 1px; }

</style>
</head>
<body>
<header>
  <h1>AIRPORT QUEUE STATUS</h1>
  <div id="refresh-info"></div>
</header>
<div id="error-banner">Failed to refresh data - showing last known values.</div>

<div class="layout">
  <div id="airport-sidebar">
    <h2>Airports</h2>
    <div id="airport-selector">
      <button type="button" id="selected-airport-label"></button>
      <input id="airport-search" type="text" autocomplete="off"
             placeholder="Search airport... (IATA or name)">
      <div id="airport-list"></div>
    </div>
  </div>
  <div id="airport-content"></div>
</div>

<script>
(function () {
  "use strict";

  // ADIM 6A-UI §7 / 6A-UI-2 - backend risk -> UI renk sınıfı. TEK
  // yer; frontend başka HİÇBİR eşik/etiket İCAT ETMEZ.
  var PILL_CLASS = {
    LOW: "pill-LOW", MEDIUM: "pill-MEDIUM", HIGH: "pill-HIGH",
    CRITICAL: "pill-CRITICAL", UNKNOWN: "pill-UNKNOWN",
  };
  var SEVERITY_COLOR = {
    UNKNOWN: "#b3b7c2", LOW: "#2fa968", MEDIUM: "#d1a92c",
    HIGH: "#e08a3c", CRITICAL: "#d4514f",
  };

  // ADIM (5-Minute Wait Display Series) - kullanıcı talebi: sütun rengi
  // backend'in 4 SABİT risk renginden (Fast/Normal/Slow/Severe) BİRİ
  // olsun - sürekli/geçişli bir gradient DEĞİL. Renk DOĞRUDAN backend'in
  // `risk` alanından (`core/scoring.py:risk_from_wait()`) okunur - burada
  // YENİ bir eşik/hesap İCAT EDİLMEZ, sadece 4 sabit renge eşlenir.
  // Kapasite aşıldı (wait=null, utilization>=1 - SADECE saatlik `windows`
  // fallback'inde mümkün, `display_5m` bu alanı hiç taşımaz) HER ZAMAN
  // en kötü/CRITICAL renktedir (teorik olarak sonsuz bekleme).
  function colorForWindow(w) {
    if (w.risk) return SEVERITY_COLOR[w.risk] || SEVERITY_COLOR.UNKNOWN;
    if (w.utilization != null && w.utilization >= 1) return SEVERITY_COLOR.CRITICAL;
    return SEVERITY_COLOR.UNKNOWN;
  }
  // ADIM (Passenger-Facing Risk Threshold v2) - backend risk kodundan
  // (LOW/MEDIUM/HIGH/CRITICAL/UNKNOWN) İNGİLİZCE UI etiketine TEK JS-
  // side eşleme - backend'in `risk_label` alanıyla (app/queue/api.py
  // `RISK_TO_UI_LABEL`) AYNI metinler, SADECE window objesi olmayan
  // yerlerde (ör. y-ekseni tick'leri, sadece height değeri bilinir,
  // belirli bir pencereye ait `risk_label` YOK) kullanılır - risk
  // wait'ten burada YENİDEN TÜRETİLMEZ, sadece zaten var olan risk
  // kodu metne çevrilir.
  var RISK_UI_LABEL = {
    LOW: "Normal", MEDIUM: "Getting Busy", HIGH: "Busy",
    CRITICAL: "Very Busy", UNKNOWN: "Unknown",
  };

  // ADIM (5-Minute Wait Display Series) - kart başlığındaki "Estimated
  // Fast/Normal/Slow/Severe" için AYRI bir sunum sözlüğü - backend'in
  // KENDİ `risk_label`'ını (yukarıdaki RISK_UI_LABEL) DEĞİŞTİRMEZ,
  // sadece bu kartın kendi kısa kelime dağarcığı. Anahtarlar backend
  // risk kodlarıyla (LOW/MEDIUM/HIGH/CRITICAL - `display_5m[].risk`,
  // zaten `core/scoring.py:risk_from_wait()`'ten gelir) AYNI - burada
  // YENİ bir eşik/hesap İCAT EDİLMEZ, zaten var olan risk kodu sadece
  // farklı bir kelimeye çevrilir.
  var ESTIMATE_LABEL = {
    LOW: "Fast", MEDIUM: "Normal", HIGH: "Slow", CRITICAL: "Severe",
  };
  function estimateLabel(risk) {
    return ESTIMATE_LABEL[risk] || null;
  }

  // "14:00" -> "2p". SADECE metin biçimlendirme - zaman/timezone
  // dönüşümü YAPMAZ, saat sayısı zaten backend'in hesapladığı yerel
  // saatten (`windowLabel`/`window_start_local`) gelir.
  function formatHour12(hour) {
    var h = ((hour % 24) + 24) % 24;
    var period = h < 12 ? "a" : "p";
    var display = h % 12;
    if (display === 0) display = 12;
    return display + period;
  }

  function localHourOf(isoLocalOrUtc) {
    var label = isoLocalOrUtc ? hhmm(isoLocalOrUtc) : "";
    return label ? parseInt(label.slice(0, 2), 10) : null;
  }

  function localMinuteOf(isoLocalOrUtc) {
    var label = isoLocalOrUtc ? hhmm(isoLocalOrUtc) : "";
    return label ? parseInt(label.slice(3, 5), 10) : null;
  }

  // ADIM (30-Minute Visual Aggregation) - GÖRSEL sadeleştirme katmanı.
  // Arka plandaki queue-state hesabı (backend'in ürettiği `display_5m`,
  // 5dk çözünürlük, 288 nokta/gün) HİÇ DEĞİŞMEDİ - bu fonksiyonlar
  // SADECE grafiğe basmadan ÖNCE, tarayıcıda, 5dk noktalarını 30dk'lık
  // görsel bar'lara (48/gün) ORTALAMA ile birleştirir. Backend'e/DB'ye/
  // FIFO'ya dokunulmadı.
  //
  // `iso`'nun dakika kısmını GERÇEK Date() dönüşümüne SOKMADAN (tarih/
  // saat/offset metnini bozma riski olmadan) saf string+integer
  // aritmetiğiyle kaydırır - `hhmm()`'in izlediği "metni Date()'e
  // sokmadan oku/yaz" ilkesiyle AYNI (bkz. o fonksiyonun yorumu).
  // Sadece gün taşması (23:xx -> ertesi gün 00:xx) olduğunda, SADECE
  // takvim gününü ilerletmek için (saat/offset'e DOKUNMADAN) UTC-nötr
  // bir Date kullanılır.
  function addMinutesToIsoLocal(iso, minutesToAdd) {
    if (!iso) return iso;
    var datePart = iso.slice(0, 10);
    var hour = parseInt(iso.slice(11, 13), 10);
    var minute = parseInt(iso.slice(14, 16), 10);
    var tail = iso.slice(16); // ":SS" + opsiyonel "[+-]HH:MM" veya "Z"
    var totalMinutes = hour * 60 + minute + minutesToAdd;
    var dayOverflow = Math.floor(totalMinutes / 1440);
    var normalizedMinutes = ((totalMinutes % 1440) + 1440) % 1440;
    var newHour = Math.floor(normalizedMinutes / 60);
    var newMinute = normalizedMinutes % 60;
    var newDatePart = datePart;
    if (dayOverflow !== 0) {
      var d = new Date(datePart + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + dayOverflow);
      newDatePart = d.toISOString().slice(0, 10);
    }
    var pad2 = function (n) { return n < 10 ? "0" + n : "" + n; };
    return newDatePart + "T" + pad2(newHour) + ":" + pad2(newMinute) + tail;
  }

  // Backend'in `core/scoring.py:risk_from_wait()` ile AYNI 4 sabit eşik
  // (10/15/30 dk) - burada YENİ bir eşik İCAT EDİLMİYOR, sadece frontend
  // averaged 30dk değerini (backend'in hiç görmediği bir sayı - backend
  // sadece ham 5dk noktalarını bilir) AYNI 4 kategoriye sınıflandırmak
  // için mirror ediliyor.
  var WAIT_RISK_LOW_MINUTES = 10, WAIT_RISK_MEDIUM_MINUTES = 15, WAIT_RISK_HIGH_MINUTES = 30;
  function riskFromWaitMinutes(wait) {
    if (wait == null) return "UNKNOWN";
    if (wait < WAIT_RISK_LOW_MINUTES) return "LOW";
    if (wait < WAIT_RISK_MEDIUM_MINUTES) return "MEDIUM";
    if (wait < WAIT_RISK_HIGH_MINUTES) return "HIGH";
    return "CRITICAL";
  }

  var VISUAL_BUCKET_MINUTES = 30;

  // 5dk `display_5m` noktalarını 30dk'lık görsel bar'lara indirger -
  // her bar, o yarım saatteki 5dk noktalarının `estimated_wait_minutes`
  // ORTALAMASI (max/son değer DEĞİL - bkz. görev notu: tek bir anlık
  // spike yarım saati olduğundan sert göstermesin, ama artış/azalış
  // trendi de kaybolmasın). Çıktı, mevcut `estimated_wait_minutes`/
  // `risk`/`risk_label`/`window_start[_local]`/`window_end[_local]`
  // alan adlarını AYNEN taşır - bu yüzden `peakBestSummary`/`drawChart`/
  // `windowLabelRange` DEĞİŞMEDEN bu bar'ları da çizebilir.
  function to30MinuteVisualBuckets(points) {
    if (!points || !points.length) return points || [];
    var buckets = {};
    var order = [];
    points.forEach(function (p) {
      var rawLocal = p.window_start_local || p.window_start;
      var rawUtc = p.window_start;
      var minute = localMinuteOf(rawLocal);
      if (minute == null) return;
      var bucketMinute = minute < 30 ? 0 : 30;
      var backOffset = -(minute - bucketMinute);
      var bucketIndex = (localHourOf(rawLocal) * 2) + (bucketMinute === 30 ? 1 : 0)
        + "@" + rawLocal.slice(0, 10);
      if (!buckets[bucketIndex]) {
        var startLocal = addMinutesToIsoLocal(rawLocal, backOffset);
        var startUtc = addMinutesToIsoLocal(rawUtc, backOffset);
        buckets[bucketIndex] = {
          window_start: startUtc,
          window_start_local: startLocal,
          window_end: addMinutesToIsoLocal(startUtc, VISUAL_BUCKET_MINUTES),
          window_end_local: addMinutesToIsoLocal(startLocal, VISUAL_BUCKET_MINUTES),
          _sum: 0, _count: 0,
        };
        order.push(bucketIndex);
      }
      var bucket = buckets[bucketIndex];
      if (p.estimated_wait_minutes != null) {
        bucket._sum += p.estimated_wait_minutes;
        bucket._count += 1;
      }
    });
    order.sort(function (a, b) {
      return buckets[a].window_start_local < buckets[b].window_start_local ? -1 : 1;
    });
    return order.map(function (idx) {
      var b = buckets[idx];
      var avg = b._count > 0 ? b._sum / b._count : null;
      var risk = riskFromWaitMinutes(avg);
      return {
        window_start: b.window_start,
        window_start_local: b.window_start_local,
        window_end: b.window_end,
        window_end_local: b.window_end_local,
        estimated_wait_minutes: avg,
        risk: risk,
        risk_label: RISK_UI_LABEL[risk] || RISK_UI_LABEL.UNKNOWN,
      };
    });
  }

  // Kartın üst özet satırı için "peak"/"best" - SADECE zaten var olan
  // `points[].estimated_wait_minutes`/`risk` üzerinden min/max arama,
  // yeni bir metrik/hesap YOK. `points`, `display_5m` (5dk) VEYA
  // `windows` (saatlik fallback, ör. "overall") olabilir - ikisi de
  // AYNI `estimated_wait_minutes`/`risk`/local-time alan adlarını taşır.
  function peakBestSummary(points) {
    var scored = (points || []).filter(function (p) {
      return p.estimated_wait_minutes != null && p.risk;
    });
    if (!scored.length) return null;
    var peak = scored[0];
    var best = scored[0];
    scored.forEach(function (p) {
      if (p.estimated_wait_minutes > peak.estimated_wait_minutes) peak = p;
      if (p.estimated_wait_minutes < best.estimated_wait_minutes) best = p;
    });
    var peakHour = localHourOf(peak.window_start_local || peak.window_start);
    var bestHour = localHourOf(best.window_start_local || best.window_start);
    return {
      peakLabel: estimateLabel(peak.risk) || peak.risk_label,
      peakHour: peakHour != null ? formatHour12(peakHour) : "",
      bestLabel: estimateLabel(best.risk) || best.risk_label,
      bestHour: bestHour != null ? formatHour12(bestHour) : "",
    };
  }

  // ADIM (Frontend 4-Graph Contract) - Bölüm 26/52: source artık
  // yaklaşık 5 dakikada bir yenileniyor - bu SADECE dış veri
  // yenilenme sıklığıdır (queue window/prediction window/service
  // interval DEĞİL, bkz. backend). Frontend request-time'da HİÇBİR
  // dış kaynağa çıkmaz, sadece kendi API'sini (DB'den okuyan,
  // salt-okunur) bu sıklıkla tekrar okur.
  var POLL_MS = 5 * 60 * 1000;

  var state = {
    directory: [],          // [{iata, name}] - son BAŞARILI /api/airports/directory
    selected: null,         // seçili IATA kodu
    predictionsByIata: {},  // iata -> son BAŞARILI /predictions yanıtı
    charts: {},
    searchQuery: "",        // ADIM (Airport Search) - kullanıcının arama kutusuna yazdığı METİN
    selectorOpen: false,    // ADIM (Airport Search/Mobile Selector) - dropdown açık mı
    // ADIM (Frontend 4-Graph Contract) - Bölüm 50/64/67: her grafik
    // kendi tıklanan penceresini BAĞIMSIZ tutar. `null` = "şu anki
    // pencere" (current) gösterilsin. DEĞER olarak array INDEX değil,
    // pencerenin KENDİ `window_start` ISO string'i tutulur - böylece
    // 5 dakikalık refresh sonrası pencere listesi değişse/kayса bile
    // (ör. eski bir pencere prune edildi) aynı SAAT aranır, aynı
    // array pozisyonu YANLIŞLIKLA başka bir saati göstermez (Bölüm 64:
    // "refresh sonrası 10.00 bucket hâlâ varsa selection kaybolmamalı").
    // Bucket artık yoksa `graphSectionHtml` güvenli şekilde `current`'a
    // düşer.
    detail: {
      overall: null, domestic_security: null,
      international_departure_passport: null, international_departure_security: null,
      international_arrival: null,
    },
  };

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function pillHtml(riskOrNull, labelOrNull) {
    if (!riskOrNull || !labelOrNull) {
      return '<span class="pill pill-none">No data</span>';
    }
    var cls = PILL_CLASS[riskOrNull] || "pill-none";
    return '<span class="pill ' + cls + '">' + escapeHtml(labelOrNull) + "</span>";
  }

  // Backend zaman damgaları HER ZAMAN naive UTC ISO string'dir - bkz.
  // app/queue/api.py. `new Date(...)` ile parse etmek tarayıcının
  // YEREL saat dilimini karıştırır (YENİ bir dönüşüm İCAT ETMEK
  // olurdu); bunun yerine ISO string'den saat:dakika STRING olarak
  // kesilir.
  function hhmm(isoString) {
    return isoString.slice(11, 16);
  }

  // ADIM (24-Hour Graph Timezone Display) - Bölüm 4/14: BEŞ görünür
  // grafiğin (Overall/Domestic Security/Intl Departure — Passport/
  // — Security/Intl Arrival) pencere label'ı artık backend'in
  // hesapladığı `window_start_local` (havalimanının GERÇEK yerel saati,
  // bkz. app/queue/api.py `_to_local_iso`) üzerinden üretilir -
  // `window_start` (CANONICAL/internal UTC) DEĞİŞMEDİ, sadece hangi
  // alanın LABEL için okunacağı değişti. `window_start_local` yoksa
  // (havalimanının timezone'u çözülemediyse - nadir, bkz. backend
  // fallback notu) ham `window_start`'a (UTC) güvenli şekilde düşülür -
  // frontend YENİ bir offset/dönüşüm İCAT ETMEZ, sadece backend'in
  // ZATEN hesapladığı alanı okur.
  function windowLabel(window) {
    var value = (window && window.window_start_local) || (window && window.window_start);
    return value ? hhmm(value) : "";
  }

  function windowLabelRange(window) {
    var startValue = (window && window.window_start_local) || (window && window.window_start);
    var endValue = (window && window.window_end_local) || (window && window.window_end);
    if (!startValue || !endValue) return "";
    return hhmm(startValue) + "–" + hhmm(endValue);
  }

  function airportLabel(entry) {
    return entry.name ? entry.iata + " - " + entry.name : entry.iata;
  }

  // ADIM (Frontend Airport Search) - Bölüm F: case-insensitive, Türkçe
  // karakterlere karşı normalize edilmiş arama. "İstanbul"/"istanbul"/
  // "İSTANBUL" hepsi AYNI şekilde eşleşsin diye Türkçe'ye özgü harfler
  // (İ/I/ı/Ş/ş/Ğ/ğ/Ü/ü/Ö/ö/Ç/ç) ASCII karşılıklarına çevrilir, SONRA
  // `toLowerCase()` uygulanır (sıra önemli: `"İ".toLowerCase()` bazı
  // ortamlarda "i̇" - noktalı, birleşik karakter - üretebilir).
  var TURKISH_FOLD_MAP = {
    "İ": "i", "I": "i", "ı": "i",
    "Ş": "s", "ş": "s",
    "Ğ": "g", "ğ": "g",
    "Ü": "u", "ü": "u",
    "Ö": "o", "ö": "o",
    "Ç": "c", "ç": "c",
  };
  function normalizeSearchText(text) {
    if (!text) return "";
    var folded = String(text).replace(/[İIışŞğĞüÜöÖçÇ]/g, function (ch) {
      return TURKISH_FOLD_MAP[ch] || ch;
    });
    return folded.toLowerCase();
  }

  function filteredDirectory() {
    var query = normalizeSearchText(state.searchQuery.trim());
    if (!query) return state.directory;
    return state.directory.filter(function (entry) {
      var haystack = normalizeSearchText(entry.iata) + " " + normalizeSearchText(entry.name || "");
      return haystack.indexOf(query) !== -1;
    });
  }

  function openSelector() {
    state.selectorOpen = true;
    document.getElementById("airport-selector").classList.add("open");
    document.getElementById("airport-search").focus();
  }

  function closeSelector() {
    state.selectorOpen = false;
    state.searchQuery = "";
    document.getElementById("airport-selector").classList.remove("open");
    var input = document.getElementById("airport-search");
    input.value = "";
    input.blur();
  }

  // ADIM (Desktop Airport Selector Always Open) - Bölüm 6/8: masaüstünde
  // arama/liste zaten HER ZAMAN görünür (bkz. CSS `@media (min-width:761px)`) -
  // bu yüzden seçim yapıldığında `closeSelector()` (listeyi kapatır, arama
  // metnini TEMİZLER) SADECE mobilde çağrılmalı; masaüstünde kullanıcı
  // filtre metnini/listeyi korumalı, hızlıca başka bir havalimanına
  // geçebilmeli (Bölüm 3). `window.matchMedia` yoksa (ör. bazı test
  // ortamları) güvenli varsayım "mobil DEĞİL" (masaüstü davranışı) - bu,
  // mobil davranışını YANLIŞLIKLA tetiklemek yerine sessizce hiçbir şey
  // KAPATMAMA yönünde daha az yıkıcı bir varsayımdır.
  function isMobileViewport() {
    return typeof window.matchMedia === "function" &&
      window.matchMedia("(max-width: 760px)").matches;
  }

  // ------------- fetch -------------

  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  // ADIM (Local Test-DB Viewing) - sayfa kendisi `?now=...` ile açıldıysa
  // (ör. eski tarihli bir test DB'sini görüntülemek için), bu SADECE
  // prediction endpoint'lerine iletilir - production varsayılan davranışı
  // (parametre yoksa gerçek duvar saati) DEĞİŞMEDİ. `window.location`
  // olmayan ortamlarda (ör. Node tabanlı frontend test harness'leri,
  // `tests/frontend_harness/*.js` - sadece `window`/`document` stub'lar,
  // `location` stub'lamaz) sessizce None'a düşer, hiçbir exception atmaz.
  var TEST_NOW = (typeof window !== "undefined" && window.location && window.location.search)
    ? new URLSearchParams(window.location.search).get("now")
    : null;

  function predictionsUrl(iata) {
    var url = "/api/airports/" + iata + "/predictions";
    return TEST_NOW ? url + "?now=" + encodeURIComponent(TEST_NOW) : url;
  }

  function loadAll() {
    return fetchJSON("/api/airports/directory").then(function (directory) {
      state.directory = directory;
      reconcileSelection();
      renderSidebar();

      if (!state.selected) {
        renderContent();
        setError(false);
        return null;
      }
      return fetchJSON(predictionsUrl(state.selected)).then(function (data) {
        state.predictionsByIata[state.selected] = data;
        renderContent();
        setError(false);
      });
    }).catch(function () {
      setError(true);
      // state KASITLI OLARAK değiştirilmiyor - ekrandaki son bilinen
      // durum kalır, sadece uyarı gösterilir. Bir havalimanının
      // prediction isteği başarısız olsa bile SİDEBAR'ın kendisi
      // (directory zaten yukarıda ayrı fetch edildi) etkilenmez.
    });
  }

  // ADIM 6A-UI-2 §4 - dinamik keşif: IST seçiliyken yeni bir AYT
  // gelirse seçim ATLAMAZ. Seçili havalimanı listeden GERÇEKTEN
  // kaybolursa (örn. artık hiç tahmini yok) ilk mevcut havalimanına
  // güvenli fallback yapılır. İlk açılışta IST varsa IST, yoksa
  // listedeki ilk havalimanı seçilir.
  function reconcileSelection() {
    var codes = state.directory.map(function (e) { return e.iata; });
    if (state.selected && codes.indexOf(state.selected) !== -1) {
      return; // seçim hâlâ geçerli - DOKUNMA
    }
    if (codes.indexOf("IST") !== -1) {
      state.selected = "IST";
    } else {
      state.selected = codes.length ? codes[0] : null;
    }
  }

  function selectAirport(iata) {
    // ADIM (Frontend Airport Search + Desktop Always Open) - Bölüm G/I
    // (mobil): seçim yapılınca dropdown/arama KAPANIR - aynı havalimanı
    // zaten seçiliyken tekrar tıklansa BİLE dropdown kapanmalı; bu
    // yüzden "aynıysa hiçbir şey yapma" kısayolu en üstte DEĞİL, önce
    // KAPATMA yapılır. Bölüm 3/8 (masaüstü): liste zaten HER ZAMAN açık
    // olduğu için `closeSelector()` masaüstünde ÇAĞRILMAZ - kullanıcı
    // arama metnini/listeyi koruyarak hızlıca başka bir havalimanına
    // geçebilir.
    if (isMobileViewport()) {
      closeSelector();
    }
    renderSidebar();
    if (iata === state.selected) return;
    state.selected = iata;
    renderSidebar();
    if (!state.predictionsByIata[iata]) {
      renderContent(); // yükleniyor durumu göster
    }
    fetchJSON(predictionsUrl(iata)).then(function (data) {
      state.predictionsByIata[iata] = data;
      if (state.selected === iata) renderContent();
    }).catch(function () {
      setError(true);
    });
  }

  // ------------- render: sidebar -------------

  function renderSelectedLabel() {
    var label = document.getElementById("selected-airport-label");
    var entry = state.directory.filter(function (e) { return e.iata === state.selected; })[0];
    if (entry) {
      label.innerHTML = escapeHtml(airportLabel(entry));
    } else {
      label.innerHTML = '<span class="muted">Select airport...</span>';
    }
  }

  function renderSidebar() {
    renderSelectedLabel();

    var el = document.getElementById("airport-list");
    if (!state.directory.length) {
      el.innerHTML = '<div class="empty">No airports being tracked yet.</div>';
      return;
    }
    var visible = filteredDirectory();
    if (!visible.length) {
      el.innerHTML = '<div class="empty">No results for "' + escapeHtml(state.searchQuery) + '".</div>';
      return;
    }
    el.innerHTML = visible.map(function (entry) {
      var active = entry.iata === state.selected ? " active" : "";
      return (
        '<button class="airport-item' + active + '" data-iata="' + entry.iata + '">' +
          '<span class="code">' + escapeHtml(entry.iata) + "</span>" +
          (entry.name ? '<span class="name">' + escapeHtml(entry.name) + "</span>" : "") +
        "</button>"
      );
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".airport-item"), function (btn) {
      btn.addEventListener("click", function () {
        selectAirport(btn.getAttribute("data-iata"));
      });
    });
  }

  // ADIM (Frontend Airport Search/Mobile Selector) - Bölüm G/H/I: arama
  // kutusu odaklanınca (masaüstü tıklama VEYA mobil dokunma - ikisi de
  // "focus" event'i tetikler) dropdown açılır; yazarken CANLI filtrelenir;
  // dropdown DIŞINA tıklanınca kapanır (seçim yapmadan vazgeçme).
  function wireAirportSelector() {
    var selectorEl = document.getElementById("airport-selector");
    var labelEl = document.getElementById("selected-airport-label");
    var inputEl = document.getElementById("airport-search");

    labelEl.addEventListener("click", openSelector);
    inputEl.addEventListener("focus", openSelector);
    inputEl.addEventListener("input", function () {
      state.searchQuery = inputEl.value;
      renderSidebar();
      // renderSidebar() `#airport-list`'i YENİDEN OLUŞTURUYOR (innerHTML) -
      // input'un KENDİSİ DOM'da aynı elemandır (yeniden oluşturulmuyor),
      // bu yüzden odak/imleç konumu KORUNUR - kullanıcı yazmaya kesintisiz devam eder.
    });
    // ADIM (Desktop Airport Selector Always Open) - Bölüm 6: dışına
    // tıklama/Escape ile "kapatma" SADECE mobilde bir anlam taşır -
    // masaüstünde panel zaten HER ZAMAN açık (CSS), bu ikisi tetiklenirse
    // SADECE arama metnini gereksiz yere TEMİZLERDİ (kullanıcı grafiğe
    // tıklayınca filtresi sıfırlanır gibi sürpriz bir davranış). Bu
    // yüzden ikisi de `isMobileViewport()` ile korunuyor.
    document.addEventListener("click", function (evt) {
      if (isMobileViewport() && state.selectorOpen && !selectorEl.contains(evt.target)) {
        closeSelector();
        renderSidebar();
      }
    });
    document.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape" && isMobileViewport() && state.selectorOpen) {
        closeSelector();
        renderSidebar();
      }
    });
  }

  // ------------- render: sağ panel -------------

  function renderContent() {
    var root = document.getElementById("airport-content");
    Object.keys(state.charts).forEach(destroyChart);

    if (!state.selected) {
      root.innerHTML = "";
      return;
    }
    var data = state.predictionsByIata[state.selected];
    var entry = state.directory.filter(function (e) { return e.iata === state.selected; })[0];
    var heading = entry ? airportLabel(entry) : state.selected;

    if (!data) {
      root.innerHTML = "<h2>" + escapeHtml(heading) + "</h2><p>Loading...</p>";
      return;
    }

    // ADIM (International Departure Split Graphs) - Bölüm 9-13: TAM 5
    // grafik - Overall / Domestic Security / International Departure
    // — Passport / International Departure — Security / International
    // Arrival (SADECE varış-kökenli passport). Passport ve security
    // artık İKİ BAĞIMSIZ grafik/current/wait - biri diğerinin current
    // saatini ASLA EZMEZ (ZRH regresyonu, bkz. api.py
    // `_international_departure_split`). Beşinci bir "domestic arrival"
    // grafiği YOK (Bölüm 16, değişmedi).
    root.innerHTML =
      "<h2>" + escapeHtml(heading) + "</h2>" +
      graphSectionHtml("overall", "OVERALL AIRPORT CONGESTION", data.overall) +
      graphSectionHtml("domestic_security", "DOMESTIC SECURITY", data.domestic_security) +
      graphSectionHtml("international_departure_passport", "INTERNATIONAL DEPARTURE — PASSPORT", data.international_departure.passport) +
      graphSectionHtml("international_departure_security", "INTERNATIONAL DEPARTURE — SECURITY", data.international_departure.security) +
      graphSectionHtml("international_arrival", "INTERNATIONAL ARRIVAL", data.international_arrival);

    drawChart(data.overall, "chart-overall", "overall");
    drawChart(data.domestic_security, "chart-domestic_security", "domestic_security");
    drawChart(data.international_departure.passport, "chart-international_departure_passport", "international_departure_passport");
    drawChart(data.international_departure.security, "chart-international_departure_security", "international_departure_security");
    drawChart(data.international_arrival, "chart-international_arrival", "international_arrival");
    renderRefreshInfo();
  }

  // ADIM (Frontend Wait-Time Formatting) - SADECE GÖSTERİM katmanı.
  // Backend/API dakika sayısını (ör. 125) DEĞİŞTİRMEZ - bu fonksiyon
  // sadece o sayıyı okunabilir "saat + dakika" metnine çevirir
  // (125 -> "2 saat 5 dk"). Queue/risk/passport/security hesapları
  // bu dosyada ZATEN yok (bkz. waitTimeText docstring'i) - bu
  // fonksiyon da hiçbir hesap YAPMAZ, sadece biçimlendirir.
  //
  // Overall / Domestic Security / International Departure — Passport /
  // International Departure — Security (artık iki BAĞIMSIZ grafik,
  // bkz. `_international_departure_split`) / International Arrival -
  // hepsi AYNI bu merkezi fonksiyonu kullanır (waitTimeText üzerinden),
  // mantık HİÇBİR YERDE kopyalanmaz.
  //
  // Kurallar:
  //   null/undefined           -> "Unavailable"
  //   0                        -> "0 min"
  //   1-59                     -> "N min"
  //   tam saat (60, 120, ...)  -> "N h"  (gereksiz "0 min" EKLENMEZ)
  //   saat + dakika (65, 125)  -> "N h M min"
  function formatWaitMinutes(minutes) {
    if (minutes == null) return "Unavailable";
    var total = Math.round(minutes);
    if (total < 60) return total + " min";
    var hours = Math.floor(total / 60);
    var rem = total % 60;
    return rem === 0 ? hours + " h" : hours + " h " + rem + " min";
  }

  // Bekleme süresi metni SADECE backend'in o pencere için ZATEN
  // döndürdüğü alanlara (`estimated_wait_minutes`, `utilization`)
  // bakar - YENİ bir Erlang-C/ortalama/tahmin hesabı YAPILMAZ.
  // ADIM 6C'den KORUNAN ayrım: `estimated_wait_minutes=null` İKİ AYRI
  // nedenle olabilir:
  //   1) `utilization` SONLU VE >= 1 -> talep kapasiteyi gerçekten
  //      aşıyor, kuyruk teorik olarak sürdürülemez -> "Kapasite aşıldı".
  //   2) `utilization` DA null -> sistem bir çalışma noktası bile
  //      KURAMADI (geçersiz/eksik config) -> "Hesaplanamıyor".
  // GENEL (overall) penceresi, o saatin en kötü sürecinin KENDİ
  // `estimated_wait_minutes`'ını taşır (bkz. api.py
  // `_merge_overall_series`) - birden fazla sürecin wait'i ASLA
  // ORTALANMAZ.
  function waitTimeText(w) {
    if (!w) return "—";
    if (w.estimated_wait_minutes != null) {
      return formatWaitMinutes(w.estimated_wait_minutes);
    }
    if (w.utilization != null && w.utilization >= 1) {
      return "Capacity exceeded";
    }
    return "Unavailable";
  }

  // ADIM (International Departure Split Graphs) - Bölüm 14: risk
  // seviyesi FARK ETMEKSİZİN (LOW dahil) sayısal wait varsa GÖSTERİLİR,
  // risk wait'i gizlemez. International Departure artık İKİ AYRI
  // grafik olduğu için (bkz. `_international_departure_split`) burada
  // tek bir pencerenin wait'i gösterilir - passport/security KENDİ
  // ayrı `graphSectionHtml()` çağrısıyla render edilir, artık BURADA
  // birleştirilmez.
  function waitDetailHtml(displayWindow) {
    if (!displayWindow) {
      return '<div class="wait-line">No data for this hour</div>';
    }
    return '<div class="wait-line">Estimated wait: <b>' + escapeHtml(waitTimeText(displayWindow)) + "</b></div>";
  }

  // ADIM (Frontend 4-Graph Contract) - Bölüm 50/64/67: her grafik
  // BAĞIMSIZ tıklanabilir. `state.detail[key]` bir `window_start` ISO
  // string'i ise, GERÇEKTEN o saate ait pencere `windows` içinde
  // ARANIR (index DEĞİL - bkz. `state` yorumu) - bulunamazsa (ör.
  // refresh sonrası prune edildi) `current`'a güvenli şekilde düşülür;
  // `current` da yoksa (windows=[]) "Bu saat için veri yok" gösterilir,
  // sayfa ÇÖKMEZ. Bir grafikte bir pencereye tıklamak DİĞER
  // grafiklerin/`current`ın gösterdiği değeri ASLA karıştırmaz.
  // ADIM (5-Minute Wait Display Series) - grafik için hangi nokta
  // dizisinin çizileceğini seçer: `display_5m` VARSA VE DOLUYSA (4
  // görünür/event-driven süreç) o kullanılır; yoksa (ör. "overall" -
  // display_5m HİÇ TAŞIMIYOR) mevcut saatlik `windows`'a düşülür. İkisi
  // de AYNI `estimated_wait_minutes`/`risk`/`window_start[_local]` alan
  // adlarını taşıdığı için (bkz. api.py `_display_point_to_dict`/
  // `_window_to_dict`) `peakBestSummary`/`drawChart` TEK bir kod
  // yolunu paylaşabilir.
  function displayPoints(section) {
    if (section.display_5m && section.display_5m.length) {
      // Aynı `section` nesnesi için TEK SEFER hesapla ve önbelleğe al -
      // `pickCurrentPoint()` ve `drawChart()` AYNI dizi REFERANSINI
      // paylaşmalı, yoksa `indexOf()` ile current-bucket highlight
      // (Bölüm 11) referans eşitliği bulamaz. `section` her refresh'te
      // API'den TAZE bir nesne olarak geldiği için stale cache riski YOK.
      if (!section._visualBuckets) {
        section._visualBuckets = to30MinuteVisualBuckets(section.display_5m);
      }
      return section._visualBuckets;
    }
    return section.windows || [];
  }

  // "Şu anki" nokta: `display_5m` kullanılıyorsa, GERÇEK duvar saatine
  // (`Date.now()`) en yakın GEÇMİŞTEKİ 5dk bucket'ı (`window_start_local`
  // AÇIK bir UTC offset taşıdığı için `new Date(...)` burada GÜVENLİDİR -
  // `hhmm()`'in kaçındığı "naive UTC'yi tarayıcı yerel saati sanma"
  // riski YOK, offset string'in içinde zaten var). `windows` fallback'inde
  // ise backend'in KENDİ seçtiği `section.current` kullanılır - frontend
  // KENDİ "şu an" mantığını İCAT ETMEZ.
  function pickCurrentPoint(section) {
    if (section.display_5m && section.display_5m.length) {
      var points = displayPoints(section); // 30dk'lık görsel bar'lar - bkz. to30MinuteVisualBuckets
      var nowMs = Date.now();
      var chosen = null;
      for (var i = 0; i < points.length; i++) {
        var raw = points[i].window_start_local || points[i].window_start;
        var ms = new Date(raw).getTime();
        if (!isNaN(ms) && ms <= nowMs) chosen = points[i];
      }
      return chosen || points[0];
    }
    return section.current || null;
  }

  function estimateSummaryHtml(currentPoint, points) {
    var badgeRisk = currentPoint ? currentPoint.risk : null;
    var badgeText = badgeRisk
      ? "Estimated " + (estimateLabel(badgeRisk) || currentPoint.risk_label)
      : "No data";
    var badgeClass = "estimate-badge-" + (badgeRisk || "none");
    var summary = peakBestSummary(points);
    var summaryLine = summary
      ? "peak " + escapeHtml(summary.peakLabel) + " at " + summary.peakHour +
        " &middot; best " + escapeHtml(summary.bestLabel) + " at " + summary.bestHour
      : "Not enough data yet for a typical pattern";
    return (
      '<div class="estimate-summary">' +
        '<span class="estimate-badge ' + badgeClass + '">' + escapeHtml(badgeText) + "</span>" +
        '<div class="peak-best-line">' + summaryLine + "</div>" +
      "</div>"
    );
  }

  var PROCESS_LEGEND_HTML =
    '<div class="process-legend">' +
      '<span class="legend-item"><i class="legend-dot" style="--dot-color:' + SEVERITY_COLOR.LOW + '"></i>Fast</span>' +
      '<span class="legend-item"><i class="legend-dot" style="--dot-color:' + SEVERITY_COLOR.MEDIUM + '"></i>Normal</span>' +
      '<span class="legend-item"><i class="legend-dot" style="--dot-color:' + SEVERITY_COLOR.HIGH + '"></i>Slow</span>' +
      '<span class="legend-item"><i class="legend-dot" style="--dot-color:' + SEVERITY_COLOR.CRITICAL + '"></i>Severe</span>' +
      '<span class="legend-item"><i class="legend-dot legend-dot-current"></i>Current</span>' +
    "</div>";

  function graphSectionHtml(key, title, section) {
    var points = displayPoints(section);
    var selectedStart = state.detail[key];
    var displayWindow = null;
    var usingCurrent = false;
    if (selectedStart != null) {
      for (var i = 0; i < points.length; i++) {
        if (points[i].window_start === selectedStart) { displayWindow = points[i]; break; }
      }
    }
    if (!displayWindow) {
      displayWindow = pickCurrentPoint(section);
      usingCurrent = true;
    }
    var canvasId = "chart-" + key;
    var chartArea = points.length
      ? '<div class="chart-wrap"><canvas id="' + canvasId + '"></canvas></div>'
      : '<div class="chart-empty">No windows yet for this airport.</div>';

    var rangeText = displayWindow ? windowLabelRange(displayWindow) : "";
    var suffix = displayWindow && usingCurrent ? " · current" : "";
    var risk = displayWindow ? displayWindow.risk : null;
    var label = displayWindow ? displayWindow.risk_label : null;

    return (
      '<div class="process-block">' +
        '<div class="process-block-head">' +
          '<div>' +
            "<h3>" + title + "</h3>" +
            '<div class="eyebrow">Today &bull; Typical by hour</div>' +
          "</div>" +
          estimateSummaryHtml(pickCurrentPoint(section), points) +
        "</div>" +
        chartArea +
        '<div class="current-line">' + pillHtml(risk, label) + "</div>" +
        (rangeText ? '<div class="wait-detail">' + escapeHtml(rangeText + suffix) + "</div>" : "") +
        // ADIM (Genel Yoğunluk'ta Süre Gizle) - kullanıcı talebi: "OVERALL
        // AIRPORT CONGESTION" (genel havalimanı yoğunluğu) bölümünde dakika
        // cinsinden süre METNİ ("Estimated wait: X min") GÖSTERİLMEZ - risk
        // pill'i (Fast/Normal/Slow/Severe) ve grafiğin kendisi DEĞİŞMEDİ,
        // sadece bu tek satır "overall" için bastırılıyor. Diğer 4 süreç
        // grafiğinde (domestic/international security, passport dep/arr)
        // süre metni AYNEN gösterilmeye devam ediyor.
        (key === "overall" ? "" : waitDetailHtml(displayWindow)) +
        PROCESS_LEGEND_HTML +
      "</div>"
    );
  }

  function renderRefreshInfo() {
    document.getElementById("refresh-info").textContent =
      "Last updated: " + new Date().toLocaleTimeString() + " · refreshes in 5 min";
  }

  function setError(isError) {
    document.getElementById("error-banner").style.display = isError ? "block" : "none";
  }

  // ------------- charts -------------

  function destroyChart(k) {
    if (state.charts[k]) {
      state.charts[k].destroy();
      delete state.charts[k];
    }
  }

  // ADIM (Continuous Wait Curve) - ÖNCEKİ sürüm burada `SEVERITY_
  // HEIGHT`'ın 4 SEVİYELİ (1/2/3/4) yüksekliğini çiziyordu - bu, wait
  // 9 dk'dan 10 dk'ya (LOW->MEDIUM eşiği) çıktığında görsel olarak
  // %100'lük bir SIÇRAMA gibi görünüyordu (gerçekte 1 dakikalık, küçük
  // bir fark) - "hesaplama hatası var gibi görünüyor" hissi BURADAN
  // geliyordu. Artık y-ekseni GERÇEK `estimated_wait_minutes` (sürekli
  // bir sayı) - risk KATEGORİSİ değil - bu yüzden küçük gerçek
  // farklılıklar küçük, büyük farklılıklar büyük görünür; backend'in
  // kendisi HİÇ değişmedi, SADECE bu fonksiyonun hangi sayıyı çizdiği
  // değişti. `waitTimeText()`/risk ile AYNI kaynak alanlar okunur,
  // yeni bir hesap YAPILMAZ.
  function chartValue(w, ceiling) {
    if (w.estimated_wait_minutes != null) return w.estimated_wait_minutes;
    if (w.utilization != null && w.utilization >= 1) {
      // Kapasite aşıldı - sayısal bir wait YOK (teorik olarak sonsuz).
      // Görsel olarak "grafikteki her şeyden daha yüksek" göstermek
      // için mevcut tavanın biraz üstünde bir nokta - GERÇEK bir dakika
      // DEĞİL, tooltip hâlâ `waitTimeText()` üzerinden "Capacity
      // exceeded" yazar (bkz. aşağı).
      return ceiling;
    }
    return 0; // Unavailable - gösterilecek sayısal bir değer yok.
  }

  // ADIM (Hourly X-Axis Labels) - x-ekseninde HER 5dk bucket için bir
  // bar VAR (288/gün) ama etiket SADECE saat başında (minute===0) VE
  // sadece seçili saatlerde yazılır - `localHourOf` tek başına saati
  // verdiği için minute kontrolü OLMADAN aynı saatin 12 ayrı 5dk noktası
  // (12:00, 12:05, ..., 12:55) hepsi "12p" yazardı - üst üste binen/
  // "garbled" etiketlerin gerçek sebebi buydu. Masaüstünde TAM 24 saat
  // etiketi (12a..11a,12p..11p) gösterilir; sadece dar ekranda 3 saatte
  // bir'e (12a,3a,6a,9a,12p,3p,6p,9p) inceltilir. Saatlik `windows`
  // fallback'i (artık SADECE `display_5m` hiç taşımayan eski/boş
  // durumlarda devreye girer - "overall" da diğer 4 grafik gibi
  // `display_5m` taşıyor, bkz. api.py `_merge_overall_display_5m`)
  // zaten sadece 24 bar ürettiği için minute===0 kontrolü onlar için de
  // zararsız çalışır (saatlik window_start zaten hep :00'da).
  var FULL_HOUR_LABELS = {};
  for (var _h = 0; _h < 24; _h++) FULL_HOUR_LABELS[_h] = true;
  var THIN_HOUR_LABELS = { 0: true, 3: true, 6: true, 9: true, 12: true, 15: true, 18: true, 21: true };
  var NARROW_WIDTH_BREAKPOINT = 480;

  function pickAxisLabelHours() {
    var width = window.innerWidth || document.documentElement.clientWidth || 1200;
    return width < NARROW_WIDTH_BREAKPOINT ? THIN_HOUR_LABELS : FULL_HOUR_LABELS;
  }

  function drawChart(section, canvasId, key) {
    var points = displayPoints(section);
    if (!points.length) return;
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;

    // ADIM (Current 5-Minute Bucket Highlight) - Bölüm 8: `pickCurrentPoint()`
    // İLE AYNI seçim (GERÇEK duvar saatine en yakın GEÇMİŞTEKİ bucket,
    // `window_start_local`'ın açık UTC offset'i sayesinde `new Date(...)`
    // burada güvenli) - o bucket'ın index'i outline için kullanılır.
    var currentPoint = pickCurrentPoint(section);
    var currentIndex = currentPoint ? points.indexOf(currentPoint) : -1;

    var axisLabelHours = pickAxisLabelHours();
    var labels = points.map(function (w) {
      var raw = w.window_start_local || w.window_start;
      var hour = localHourOf(raw);
      var minute = localMinuteOf(raw);
      var isHourMark = minute === 0 || minute === null; // saatlik `windows` fallback'inde minute her zaman 0
      return hour != null && isHourMark && axisLabelHours[hour] ? formatHour12(hour) : "";
    });
    var realWaits = points
      .map(function (w) { return w.estimated_wait_minutes; })
      .filter(function (v) { return v != null; });
    var maxReal = realWaits.length ? Math.max.apply(null, realWaits) : 0;
    // ADIM (Capacity-Exceeded Visual Ceiling) - gerçek en yüksek wait'in
    // %25 üstü, en az 10 dk - kapasite aşıldı sütunu HER ZAMAN görünür
    // şekilde diğerlerinden yüksek durur ama eksen ölçeği anlamsız
    // büyümez (ör. tek bir "Capacity exceeded" saati yüzünden eksen
    // 1000 dk'ya sıçramaz).
    var ceiling = Math.max(10, maxReal * 1.25);
    var values = points.map(function (w) { return chartValue(w, ceiling); });
    var colors = points.map(colorForWindow);
    // Current bucket: kendi risk rengini korur, sadece etrafına açık
    // yeşil bir outline eklenir (Bölüm 8) - diğer barlar kenarlıksız.
    var borderColors = points.map(function (w, i) {
      return i === currentIndex ? "#6fcf97" : "rgba(0,0,0,0)";
    });
    var borderWidths = points.map(function (w, i) { return i === currentIndex ? 2 : 0; });
    // ADIM (Clean Axis Ceiling) - `ceiling * 1.1` çoğu zaman çirkin bir
    // ondalık üretir (ör. "22.4125 min") - Chart.js bunu OLDUĞU GİBİ en
    // üst eksen etiketine basar (kendi "nice number" mantığı `max`
    // AÇIKÇA verildiğinde devreye girmiyor). En yakın 5'e YUKARI
    // yuvarlanır - grafiğin GERÇEK verisi/oranları DEĞİŞMEZ, sadece
    // eksenin üst sınırı/etiketi temiz bir sayı olur.
    var axisMax = Math.ceil(Math.max(ceiling * 1.1, 10) / 5) * 5;

    state.charts[canvasId] = new Chart(canvas, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderColor: borderColors,
          borderWidth: borderWidths,
          borderRadius: 2,
          maxBarThickness: 10,
          // ADIM (Zero-Wait Still Visible) - 0 dakikalık (gerçek, LOW/
          // yeşil) bir bucket Chart.js'te YÜKSEKLİĞİ 0 olduğu için
          // tamamen KAYBOLURDU - `minBarLength` (piksel) veriyi/rengi
          // DEĞİŞTİRMEZ, SADECE 0'a çok yakın sütunlara en az bu kadar
          // piksel yükseklik ÇİZDİRİR, tooltip/gerçek değer ETKİLENMEZ.
          minBarLength: 3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        // ADIM (Refresh Animation) - her refresh'te (5 dk'lık otomatik
        // poll dahil) grafik YENİDEN OLUŞTURULUYOR (bkz. `renderContent`)
        // - bu yüzden yeni değerlere geçiş HER ZAMAN bu "giriş"
        // animasyonuyla (400ms, sütunların büyümesi) olur; eski/yeni
        // değer arasında ANİ bir "sıçrama" göstermez.
        animation: { duration: 400, easing: "easeOutQuart" },
        // ADIM (Frontend 4-Graph Contract) - Bölüm 50/64/67: bir noktaya
        // tıklamak SADECE bu grafiğin (`key`) kendi seçili penceresini
        // değiştirir; hesaplama YAPILMAZ, sadece zaten yüklü noktanın
        // KENDİ `window_start`'ı saklanır (array index DEĞİL - bkz.
        // `state` yorumu, refresh sonrası aynı SAAT'i bulabilmek için).
        onClick: function (evt, elements) {
          if (!elements.length) return;
          state.detail[key] = points[elements[0].index].window_start;
          renderContent();
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            displayColors: false,
            callbacks: {
              // ADIM (Sade Hover) - kullanıcı talebi: hover'da SADECE
              // Time / Wait / Status - passenger/utilization/backlog/
              // server/capacity GÖSTERİLMEZ (kullanıcı kartında gereksiz).
              // Time tek bir 24-saatlik HH:MM ("20:00", "20:30") - bar'ın
              // KENDİ başlangıç saati - bir aralık ("11:30–12:00") DEĞİL.
              title: function (items) {
                var w = points[items[0].dataIndex];
                var value = w.window_start_local || w.window_start;
                return value ? "Time: " + hhmm(value) : "";
              },
              label: function (item) {
                var w = points[item.dataIndex];
                var riskText = estimateLabel(w.risk) || w.risk_label || RISK_UI_LABEL.UNKNOWN;
                // ADIM (Genel Yoğunluk'ta Süre Gizle - Hover) - "overall"
                // (OVERALL AIRPORT CONGESTION) grafiğinde hover tooltip'i de
                // dakika göstermiyor - sadece Status. Diğer 4 süreç
                // grafiğinde (security/passport) Wait satırı AYNEN kalıyor.
                if (key === "overall") return ["Status: " + riskText];
                return [
                  "Wait: " + waitTimeText(w),
                  "Status: " + riskText,
                ];
              },
            },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { autoSkip: false, maxRotation: 0, font: { size: 10 } },
          },
          y: {
            min: 0,
            max: axisMax,
            grid: { color: "#eef0f3" },
            ticks: {
              font: { size: 10 },
              callback: function (value) { return value + " min"; },
            },
          },
        },
      },
    });
  }

  // ------------- boot -------------

  wireAirportSelector();
  loadAll();
  setInterval(loadAll, POLL_MS);
})();
</script>
</body>
</html>
